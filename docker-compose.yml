services:
  backend:
    build: { context: ., target: api }
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 9001
      CORS_ORIGIN: http://localhost:9000
    ports: ['9001:9001']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:9001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
  frontend:
    build: { context: ., target: web }
    depends_on:
      backend: { condition: service_healthy }
    ports: ['9000:9000']
