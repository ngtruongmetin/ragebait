services:
  backend:
    build: { context: ., target: api }
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 9001
      CORS_ORIGIN: ${CORS_ORIGIN:-https://ragebait.bcic.site}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      RAGE_SHIELD_MAX_REQUESTS: ${RAGE_SHIELD_MAX_REQUESTS:-10}
    ports: ['127.0.0.1:9001:9001']
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:9001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
  frontend:
    build: { context: ., target: web }
    depends_on:
      backend: { condition: service_healthy }
    ports: ['127.0.0.1:9000:9000']
    restart: unless-stopped
